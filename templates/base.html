<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163a34">
  <title>{% block title %}日常清單{% endblock %} · Flask Web Camp</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  {% include 'navbar.html' %}
  <main id="main" class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">
    <span>從一個小任務，開始今天。</span>
    <span>Flask Web Camp <span aria-hidden="true">/</span> 2022 → 2026</span>
  </footer>
</body>
</html>
